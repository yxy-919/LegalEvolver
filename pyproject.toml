[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalevolver"
version = "0.2.0"
description = "LegalEvolver legal retrieval, checkpoint inference and evaluation"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu>=1.8",
  "numpy>=1.24",
  "openai>=1.40",
  "pyyaml>=6.0",
  "sentence-transformers>=3.0",
  "torch",
  "transformers",
  "tqdm",
  "scikit-learn",
]

[project.optional-dependencies]
serve = ["vllm"]

[tool.setuptools.packages.find]
include = ["Retrieval*", "Eval*"]

[tool.setuptools.package-data]
Retrieval = ["config.yaml", "demo_config.yaml", "demo_data/*"]
Eval = ["data/*", "demo_data/*"]
