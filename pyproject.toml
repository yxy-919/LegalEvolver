[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalevolver"
version = "0.1.0"
description = "Reference implementation of rubric-guided query optimization for legal judgment prediction"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu>=1.8",
  "numpy>=1.24",
  "openai>=1.40",
  "pyyaml>=6.0",
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

